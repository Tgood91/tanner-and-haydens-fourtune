<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourtune HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  background: transparent;
  overflow: hidden;
  font-family: 'Barlow Condensed', system-ui, sans-serif;
  color: #fff;
  user-select: none;
  pointer-events: none;
}

/* ---- shared panel chrome ---- */
.panel {
  background: linear-gradient(135deg, rgba(8,12,18,.82) 0%, rgba(12,18,28,.76) 100%);
  border: 1px solid rgba(255,255,255,.09);
  backdrop-filter: blur(6px);
  border-radius: 6px;
  position: fixed;
}

/* ========================================================
   TOP-LEFT  —  badge, money, job, status
   ======================================================== */
#top-left {
  top: 20px; left: 20px;
  padding: 12px 16px;
  min-width: 220px;
  max-width: 300px;
}

/* city badge row */
.badge-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
}
.city-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.07);
  transition: background .3s, border-color .3s, color .3s;
}
.city-badge .city-lbl {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
}
.city-badge .city-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .04em;
  color: #fff;
  transition: color .3s;
}
/* per-city accent */
.city-badge[data-city="chicago"]  { border-color: rgba(91,184,220,.45); background: rgba(91,184,220,.10); }
.city-badge[data-city="chicago"]  .city-code { color: #8CD6F0; }
.city-badge[data-city="atlanta"]  { border-color: rgba(232,121,58,.45);  background: rgba(232,121,58,.10);  }
.city-badge[data-city="atlanta"]  .city-code { color: #F09050; }
.city-badge[data-city="geepee"]   { border-color: rgba(126,196,123,.45); background: rgba(126,196,123,.10); }
.city-badge[data-city="geepee"]   .city-code { color: #90D48E; }

/* time + weather inline */
.world-row {
  font-size: 12px;
  color: rgba(255,255,255,.38);
  letter-spacing: .07em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* money rows */
.money-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 7px;
}
.money-label {
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  width: 40px;
  flex-shrink: 0;
}
.money-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: #fff;
  letter-spacing: .03em;
}
.money-value.gold { color: #E0C060; }

/* job + status */
.job-row {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,.07);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.job-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1em;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-flag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  white-space: nowrap;
}
.status-flag.tone-critical { background: rgba(220,60,60,.25); color: #FF7070; border: 1px solid rgba(220,60,60,.4); }
.status-flag.tone-ok       { background: rgba(60,180,120,.18); color: #60CC90; border: 1px solid rgba(60,180,120,.35); }

/* ========================================================
   BOTTOM-RIGHT  —  vitals, location
   ======================================================== */
#bottom-right {
  bottom: 20px; right: 20px;
  padding: 12px 16px;
  min-width: 200px;
  max-width: 260px;
}

/* vital bars */
.vital-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.vital-row:last-of-type { margin-bottom: 0; }

.vital-icon {
  font-size: 13px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.vital-bar-wrap {
  flex: 1 1 auto;
  height: 5px;
  background: rgba(255,255,255,.10);
  border-radius: 3px;
  overflow: hidden;
}
.vital-bar {
  height: 100%;
  border-radius: 3px;
  transition: width .5s ease, background .4s;
}
.vital-bar.health  { background: #E05050; }
.vital-bar.hunger  { background: #D0A040; }
.vital-bar.thirst  { background: #4090D0; }
.vital-bar.level-low      { filter: brightness(1.2); }
.vital-bar.level-critical { filter: brightness(1.4); animation: pulse 0.9s ease-in-out infinite alternate; }

@keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }

.vital-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,.4);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
}

/* location */
.location-row {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,.07);
  font-size: 11px;
  color: rgba(255,255,255,.30);
  letter-spacing: .05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}

/* ========================================================
   BOTTOM-LEFT  —  vehicle panel (hidden when on foot)
   ======================================================== */
#vehicle-panel {
  bottom: 20px; left: 20px;
  padding: 11px 15px;
  min-width: 180px;
  max-width: 230px;
  transition: opacity .25s, transform .25s;
}
#vehicle-panel.hidden {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}

.veh-plate {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
  margin-bottom: 9px;
}

.veh-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}
.veh-label {
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.30);
  width: 42px;
  flex-shrink: 0;
}
.veh-bar-wrap {
  flex: 1 1 auto;
  height: 4px;
  background: rgba(255,255,255,.10);
  border-radius: 2px;
  overflow: hidden;
}
.veh-bar {
  height: 100%;
  border-radius: 2px;
  transition: width .5s ease, background .4s;
}
.veh-bar.fuel   { background: #50A8E0; }
.veh-bar.engine { background: #60CC90; }
.veh-bar.level-low      { background: #D08030 !important; }
.veh-bar.level-critical { background: #D03030 !important; animation: pulse 0.9s ease-in-out infinite alternate; }
.veh-pct {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,.35);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
}

/* ========================================================
   ZONE TRANSITION  —  brief centre flash on city change
   ======================================================== */
#zone-flash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
#zone-flash.show { opacity: 1; }
#zone-flash.fade { opacity: 0; transition: opacity 1.2s ease-out; }

.zone-inner {
  text-align: center;
}
.zone-entering {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(255,255,255,.45);
  margin-bottom: 4px;
}
.zone-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 72px;
  font-weight: 500;
  letter-spacing: .06em;
  line-height: 1;
  text-shadow: 0 0 60px currentColor;
  transition: color .3s;
}
.zone-code[data-city="chicago"]  { color: #8CD6F0; }
.zone-code[data-city="atlanta"]  { color: #F09050; }
.zone-code[data-city="geepee"]   { color: #90D48E; }
.zone-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.40);
  margin-top: 6px;
}

/* ========================================================
   VISIBILITY TOGGLE (pause menu)
   ======================================================== */
#hud-root {
  transition: opacity .25s;
}
#hud-root.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="hud-root">

  <!-- top-left -->
  <div id="top-left" class="panel">
    <div class="badge-row">
      <div class="city-badge" id="city-badge" data-city="atlanta">
        <span class="city-lbl" id="city-lbl">ATL</span>
        <span class="city-code" id="city-code">1017</span>
      </div>
      <div class="world-row" id="world-row">—</div>
    </div>
    <div class="money-row">
      <span class="money-label">Cash</span>
      <span class="money-value" id="cash">$0</span>
    </div>
    <div class="money-row">
      <span class="money-label">Bank</span>
      <span class="money-value" id="bank">$0</span>
    </div>
    <div class="money-row">
      <span class="money-label">Gold</span>
      <span class="money-value gold" id="gold">0</span>
    </div>
    <div class="job-row">
      <span class="job-name" id="job-name">—</span>
      <div id="status-flags"></div>
    </div>
  </div>

  <!-- bottom-right: vitals -->
  <div id="bottom-right" class="panel">
    <div class="vital-row">
      <span class="vital-icon">♥</span>
      <div class="vital-bar-wrap"><div class="vital-bar health" id="bar-health" style="width:100%"></div></div>
      <span class="vital-val" id="val-health">100</span>
    </div>
    <div class="vital-row">
      <span class="vital-icon">🍔</span>
      <div class="vital-bar-wrap"><div class="vital-bar hunger" id="bar-hunger" style="width:100%"></div></div>
      <span class="vital-val" id="val-hunger">100</span>
    </div>
    <div class="vital-row">
      <span class="vital-icon">💧</span>
      <div class="vital-bar-wrap"><div class="vital-bar thirst" id="bar-thirst" style="width:100%"></div></div>
      <span class="vital-val" id="val-thirst">100</span>
    </div>
    <div class="location-row" id="location">—</div>
  </div>

  <!-- bottom-left: vehicle (hidden when on foot) -->
  <div id="vehicle-panel" class="panel hidden">
    <div class="veh-plate" id="veh-plate">— — — — —</div>
    <div class="veh-bar-row">
      <span class="veh-label">Fuel</span>
      <div class="veh-bar-wrap"><div class="veh-bar fuel" id="bar-fuel" style="width:100%"></div></div>
      <span class="veh-pct" id="val-fuel">100%</span>
    </div>
    <div class="veh-bar-row">
      <span class="veh-label">Engine</span>
      <div class="veh-bar-wrap"><div class="veh-bar engine" id="bar-engine" style="width:100%"></div></div>
      <span class="veh-pct" id="val-engine">100%</span>
    </div>
  </div>

  <!-- zone-transition flash -->
  <div id="zone-flash">
    <div class="zone-inner">
      <div class="zone-entering">Now entering</div>
      <div class="zone-code" id="flash-code" data-city="atlanta">1017</div>
      <div class="zone-name" id="flash-name">Atlanta</div>
    </div>
  </div>

</div><!-- #hud-root -->

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const CITY_NAMES = { chicago: 'Chicago', atlanta: 'Atlanta', geepee: 'GeePee' };

  let lastCity = null;
  let flashTimer = null;

  function setBar(barEl, valEl, value, kind) {
    const pct = Math.max(0, Math.min(100, value));
    barEl.style.width = pct + '%';
    if (valEl) valEl.textContent = Math.round(pct);
    barEl.className = 'vital-bar ' + kind + ' ' + (pct <= 10 ? 'level-critical' : pct <= 25 ? 'level-low' : '');
  }

  function setVehBar(barEl, valEl, pct, kind) {
    const p = Math.max(0, Math.min(100, pct));
    barEl.style.width = p + '%';
    if (valEl) valEl.textContent = Math.round(p) + '%';
    barEl.className = 'veh-bar ' + kind + ' ' + (p <= 10 ? 'level-critical' : p <= 25 ? 'level-low' : '');
  }

  function flashZone(city, code) {
    const el = $('zone-flash');
    const codeEl = $('flash-code');
    const nameEl = $('flash-name');
    codeEl.textContent = code;
    codeEl.dataset.city = city;
    nameEl.textContent = CITY_NAMES[city] || city;
    el.className = 'show';
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      el.className = 'fade';
      flashTimer = setTimeout(() => { el.className = ''; }, 1200);
    }, 1600);
  }

  function applyHud(p) {
    // city badge
    const badge = $('city-badge');
    badge.dataset.city = p.city;
    $('city-lbl').textContent = p.cityLabel || 'ATL';
    $('city-code').textContent = p.cityCode || '1017';

    // zone transition
    if (lastCity && lastCity !== p.city) flashZone(p.city, p.cityCode || p.city);
    lastCity = p.city;

    // world
    const parts = [];
    if (p.time) parts.push(p.time);
    if (p.weather) parts.push(p.weather);
    $('world-row').textContent = parts.join(' · ') || '—';

    // money
    $('cash').textContent = p.cash || '$0';
    $('bank').textContent = p.bank || '$0';
    $('gold').textContent = (p.gold || 0) + ' gold';

    // job + status
    $('job-name').textContent = p.job || '—';
    const flagsEl = $('status-flags');
    flagsEl.innerHTML = '';
    for (const f of (p.status || [])) {
      const span = document.createElement('span');
      span.className = 'status-flag tone-' + (f.tone || 'ok');
      span.textContent = f.text;
      flagsEl.appendChild(span);
    }

    // vitals
    setBar($('bar-health'), $('val-health'), p.health?.value ?? 100, 'health');
    setBar($('bar-hunger'), $('val-hunger'), p.hunger?.value ?? 100, 'hunger');
    setBar($('bar-thirst'), $('val-thirst'), p.thirst?.value ?? 100, 'thirst');

    // location
    $('location').textContent = p.place || '—';

    // vehicle
    const vp = $('vehicle-panel');
    if (p.vehicle) {
      vp.classList.remove('hidden');
      $('veh-plate').textContent = p.vehicle.plate || '—';
      setVehBar($('bar-fuel'),   $('val-fuel'),   p.vehicle.fuel?.percent ?? 100, 'fuel');
      setVehBar($('bar-engine'), $('val-engine'), p.vehicle.engine ?? 100,        'engine');
    } else {
      vp.classList.add('hidden');
    }
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || !msg.type) return;

    if (msg.type === 'hud') {
      applyHud(msg.payload);
    } else if (msg.type === 'visible') {
      $('hud-root').classList.toggle('hidden', !msg.visible);
    }
  });

  // Show a placeholder so it's visible on first load
  applyHud({
    city: 'atlanta', cityCode: '1017', cityLabel: 'ATL',
    cash: '$0', bank: '$0', gold: 0,
    job: 'Loading…', status: [],
    health: { value: 100 }, hunger: { value: 100 }, thirst: { value: 100 },
    place: '—', time: null, weather: null,
    vehicle: null,
  });
})();
</script>
</body>
</html>
